<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cadastro — X9 Hospital</title>
  <style>
    :root{--accent:#0b6efd;background:#f4f7fb}
    body{font-family:Inter,Arial;margin:0;background:var(--accent);color:#112}
    .wrap{max-width:760px;margin:40px auto;background:white;padding:22px;border-radius:10px;box-shadow:0 8px 30px rgba(2,10,40,.12)}
    h1{margin:0 0 10px}
    label{display:block;margin-top:10px;font-weight:600}
    input, select{width:100%;padding:10px;border-radius:8px;border:1px solid #e0e6ef;margin-top:6px}
    .row{display:flex;gap:10px}
    .row .col{flex:1}
    .btn{margin-top:16px;padding:10px 14px;background:#0b6efd;color:white;border-radius:8px;border:0;cursor:pointer;font-weight:700}
    .small{font-size:13px;color:#666;margin-top:8px}
    a{color:var(--accent);text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Crie sua conta — X9 Hospital</h1>
    <p class="small">Preencha os dados abaixo para criar seu usuário. (Demo com armazenamento local.)</p>

    <form id="formCadastro">
      <label for="nome">Nome completo</label>
      <input id="nome" required placeholder="Seu nome" />

      <div class="row">
        <div class="col">
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="seu@email.com" />
        </div>
        <div class="col">
          <label for="telefone">Telefone</label>
          <input id="telefone" placeholder="(xx) 9xxxx-xxxx" />
        </div>
      </div>

      <label for="senha">Senha (mín 6 caract.)</label>
      <input id="senha" type="password" minlength="6" required />

      <label for="nasc">Data de nascimento</label>
      <input id="nasc" type="date" />

      <button class="btn" type="submit">Criar conta</button>
      <p class="small">Já tem conta? <a href="login.html">Entrar</a></p>
    </form>

    <div id="msg" style="margin-top:12px;color:green;font-weight:700"></div>
  </div>

  <script>
    // Funções simples de persistência usando localStorage (demo)
    function carregarUsuarios(){
      const raw = localStorage.getItem('x9_usuarios') || '[]';
      try{ return JSON.parse(raw); } catch(e){ return []; }
    }
    function salvarUsuarios(u){ localStorage.setItem('x9_usuarios', JSON.stringify(u)); }

    document.getElementById('formCadastro').addEventListener('submit', function(e){
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const senha = document.getElementById('senha').value;
      const telefone = document.getElementById('telefone').value.trim();
      const nasc = document.getElementById('nasc').value;

      if(senha.length < 6){ alert('Senha curta.'); return; }
      const usuarios = carregarUsuarios();
      if(usuarios.find(u=>u.email===email)){
        alert('Email já cadastrado. Faça login.');
        location.href = 'login.html';
        return;
      }

      const novo = { id: Date.now(), nome, email, senha, telefone, nasc };
      usuarios.push(novo);
      salvarUsuarios(usuarios);

      document.getElementById('msg').textContent = 'Conta criada com sucesso! Redirecionando...';
      setTimeout(()=> location.href = 'login.html', 1200);
    });
  </script>
</body>
</html>
